<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CoZi | Landlord Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="public-page auth-page">
  <header class="site-nav" aria-label="Primary navigation">
    <a class="site-nav__brand" href="index.html" aria-label="CoZi home">
      <span class="site-nav__brand-mark" aria-hidden="true"></span>
      <span>CoZi</span>
    </a>
    <nav class="site-nav__links">
      <a href="listings.html">Browse listings</a>
      <a href="landlord-signup.html">Sign up</a>
    </nav>
  </header>

  <main class="auth-shell">
    <div class="auth-container">
      <div class="auth-header">
        <p class="eyebrow">For landlords</p>
        <h1 class="auth-title">Welcome back</h1>
        <p class="auth-subtitle">Log in to manage your CoZi listings.</p>
      </div>

      <div class="card auth-card">
        <form id="loginForm" novalidate>
          <div class="auth-field">
            <label class="auth-field__label" for="email">Email</label>
            <input type="email" id="email" autocomplete="email" placeholder="you@email.com" required />
          </div>
          <div class="auth-field">
            <label class="auth-field__label" for="password">Password</label>
            <input type="password" id="password" autocomplete="current-password" placeholder="Your password" required />
          </div>
          <div class="auth-extras">
            <span></span>
            <a class="auth-link" href="landlord-forgot-password.html">Forgot password?</a>
          </div>
          <button type="submit" class="button-link button-link--full">Log in</button>
          <p id="authStatus" class="auth-status" aria-live="polite"></p>
        </form>

        <div id="unverifiedState" hidden>
          <div class="auth-divider">not verified</div>
          <p style="font-size:0.9rem;color:var(--text-muted);text-align:center;line-height:1.6;">
            Your email hasn't been verified yet. Check your inbox or resend the link.
          </p>
          <button type="button" id="resendBtn" class="button-link button-link--ghost button-link--full">
            Resend verification email
          </button>
          <p id="resendStatus" class="auth-status" aria-live="polite" style="text-align:center;"></p>
        </div>
      </div>

      <p class="auth-footer">New landlord? <a class="auth-link" href="landlord-signup.html">Create an account</a></p>
    </div>
  </main>

  <script src="landlord-login.js"></script>
</body>
</html>
