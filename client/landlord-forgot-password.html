<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CoZi | Forgot Password</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="public-page auth-page">
  <header class="site-nav" aria-label="Primary navigation">
    <a class="site-nav__brand" href="index.html" aria-label="CoZi home">
      <span class="site-nav__brand-mark" aria-hidden="true"></span>
      <span>CoZi</span>
    </a>
  </header>

  <main class="auth-shell">
    <div class="auth-container">
      <div class="auth-header">
        <p class="eyebrow">For landlords</p>
        <h1 class="auth-title">Forgot your password?</h1>
        <p class="auth-subtitle">Enter your email and we'll send you a reset link.</p>
      </div>

      <div class="card auth-card">
        <form id="forgotForm" novalidate>
          <div class="auth-field">
            <label class="auth-field__label" for="email">Email</label>
            <input type="email" id="email" autocomplete="email" placeholder="you@email.com" required />
          </div>
          <button type="submit" class="button-link button-link--full">Send reset link</button>
          <p id="authStatus" class="auth-status" aria-live="polite"></p>
        </form>
      </div>

      <p class="auth-footer"><a class="auth-link" href="landlord-login.html">← Back to login</a></p>
    </div>
  </main>

  <script src="landlord-forgot-password.js"></script>
</body>
</html>
