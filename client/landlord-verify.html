<!DOCTYPE html>
<html lang="en">
<head>

  <title>CoZi | Verifying your account</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="public-page auth-page">
  <header class="site-nav" aria-label="Primary navigation">
    <a class="site-nav__brand" href="index.html" aria-label="CoZi home">
      <span class="site-nav__brand-mark" aria-hidden="true"></span>

  <main class="auth-shell">
    <div class="auth-container">

      </div>
    </div>

  <script src="landlord-verify.js"></script>
