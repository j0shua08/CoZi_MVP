<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CoZi | Reset Password</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="public-page auth-page">
  <header class="site-nav" aria-label="Primary navigation">
    <a class="site-nav__brand" href="index.html" aria-label="CoZi home">
      <span class="site-nav__brand-mark" aria-hidden="true"></span>
      <span>CoZi</span>
    </a>
  </header>

  <main class="auth-shell">
    <div class="auth-container">
      <div class="auth-header">
        <p class="eyebrow">For landlords</p>
        <h1 class="auth-title">Choose a new password</h1>
        <p class="auth-subtitle">Make it something you'll remember.</p>
      </div>

      <div class="card auth-card">
        <form id="resetForm" novalidate>
          <div class="auth-field">
            <label class="auth-field__label" for="password">New Password</label>
            <input type="password" id="password" autocomplete="new-password" placeholder="At least 8 characters" required />
          </div>
          <div class="auth-field">
            <label class="auth-field__label" for="confirmPassword">Confirm New Password</label>
            <input type="password" id="confirmPassword" autocomplete="new-password" placeholder="Repeat your new password" required />
          </div>
          <button type="submit" class="button-link button-link--full">Reset password</button>
          <p id="authStatus" class="auth-status" aria-live="polite"></p>
        </form>

        <div id="successState" hidden>
          <div class="auth-verify">
            <p class="auth-verify__icon">✅</p>
            <h2>Password updated</h2>
            <p>Your password has been reset. You can now log in with your new password.</p>
            <a class="button-link button-link--full" href="landlord-login.html">Go to login</a>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="landlord-reset-password.js"></script>
</body>
</html>
